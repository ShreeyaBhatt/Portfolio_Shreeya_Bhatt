<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030712" />
    <script>
      // Set theme + per-page colour before first paint so there's no flash.
      // Dark ("deep space") is the intended look; only an explicit "light"
      // choice opts out. `data-page` picks the accent + ground per route.
      try {
        var r = document.documentElement;
        if (localStorage.getItem("theme") !== "light") r.classList.add("dark");
        var p = location.pathname;
        r.setAttribute(
          "data-page",
          p === "/"
            ? "deck"
            : p.indexOf("/about") === 0
              ? "crew"
              : p.indexOf("/projects") === 0
                ? "missions"
                : p.indexOf("/contact") === 0
                  ? "channel"
                  : "lost"
        );
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <title>Shreeya Bhatt — Python Developer · Data / AI / Full-Stack</title>
    <meta
      name="description"
      content="Shreeya Bhatt — a Computer Science student and Python developer building AI-powered, data-driven applications end to end. Explore the missions."
    />
    <meta property="og:title" content="Shreeya Bhatt — Space Command Center" />
    <meta
      property="og:description"
      content="Python developer building AI-powered, data-driven applications end to end. Enter the command deck."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
